name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: openpulse
          POSTGRES_USER: openpulse
          POSTGRES_PASSWORD: openpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openpulse -d openpulse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Backend verify (Maven)
        env:
          OPENPULSE_DB_URL: jdbc:postgresql://localhost:5432/openpulse
          OPENPULSE_DB_USERNAME: openpulse
          OPENPULSE_DB_PASSWORD: openpulse
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Frontend smoke e2e
        working-directory: frontend
        run: npm run test:e2e:smoke
