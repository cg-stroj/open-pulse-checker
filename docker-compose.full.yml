
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${OPENPULSE_DB_NAME:-openpulse}
      POSTGRES_USER: ${OPENPULSE_DB_USERNAME:-openpulse}
      POSTGRES_PASSWORD: ${OPENPULSE_DB_PASSWORD:?set OPENPULSE_DB_PASSWORD}
    ports:
      - "${OPENPULSE_DB_PORT:-5432}:5432"
    volumes:
      - openpulse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OPENPULSE_DB_USERNAME:-openpulse} -d ${OPENPULSE_DB_NAME:-openpulse}"]
      interval: 10s
      timeout: 5s
      retries: 8

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      OPENPULSE_DB_URL: jdbc:postgresql://postgres:5432/${OPENPULSE_DB_NAME:-openpulse}
      OPENPULSE_DB_USERNAME: ${OPENPULSE_DB_USERNAME:-openpulse}
      OPENPULSE_DB_PASSWORD: ${OPENPULSE_DB_PASSWORD:?set OPENPULSE_DB_PASSWORD}
      OPENPULSE_SECURITY_BOOTSTRAP_ADMIN_ENABLED: ${OPENPULSE_SECURITY_BOOTSTRAP_ADMIN_ENABLED:-false}
      OPENPULSE_SECURITY_BOOTSTRAP_ADMIN_USERNAME: ${OPENPULSE_SECURITY_BOOTSTRAP_ADMIN_USERNAME:-admin}
      OPENPULSE_SECURITY_BOOTSTRAP_ADMIN_PASSWORD: ${OPENPULSE_SECURITY_BOOTSTRAP_ADMIN_PASSWORD:-}
      OPENPULSE_SECURITY_CORS_ALLOWED_ORIGINS: ${OPENPULSE_SECURITY_CORS_ALLOWED_ORIGINS:-}
      OPENPULSE_SECURITY_CORS_ALLOW_CREDENTIALS: ${OPENPULSE_SECURITY_CORS_ALLOW_CREDENTIALS:-true}
      JAVA_TOOL_OPTIONS: -XX:+UseContainerSupport -XX:MaxRAMPercentage=75
    ports:
      - "${OPENPULSE_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${OPENPULSE_FRONTEND_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${OPENPULSE_FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8

volumes:
  openpulse-postgres-data:
