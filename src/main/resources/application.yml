spring:
  application:
    name: open-pulse-checker
  datasource:
    url: jdbc:h2:mem:openpulse;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics

openpulse:
  scheduler:
    poll-interval-ms: 5000
    worker-pool-size: 4
  alerting:
    webhook:
      enabled: false
      url: ""
      max-attempts: 3
      initial-backoff-ms: 100
  security:
    auth-mode: db
    bootstrap-admin:
      enabled: false
      username: admin
      password: ""
    bootstrap-api-key:
      enabled: false
      key-id: ""
      role: ADMIN
      secret: ""
  rate-limit:
    sensitive:
      capacity: 10
      refill-tokens: 10
      refill-period-seconds: 60
