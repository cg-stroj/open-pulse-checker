spring:
  application:
    name: open-pulse-checker
  profiles:
    default: dev
  datasource:
    url: ${OPENPULSE_DB_URL:jdbc:postgresql://localhost:5432/openpulse}
    username: ${OPENPULSE_DB_USERNAME:openpulse}
    password: ${OPENPULSE_DB_PASSWORD:openpulse}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  info:
    env:
      enabled: false

info:
  app:
    name: ${spring.application.name}

openpulse:
  scheduler:
    poll-interval-ms: 5000
    worker-pool-size: 4
  alerting:
    webhook:
      enabled: false
      url: ""
      max-attempts: 3
      initial-backoff-ms: 100
  security:
    auth-mode: db
    bootstrap-admin:
      enabled: false
      emergency-fallback-enabled: false
      username: admin
      password: ""
    bootstrap-api-key:
      enabled: false
      key-id: ""
      role: ADMIN
      secret: ""
    setup:
      token-ttl-seconds: 900
  rate-limit:
    sensitive:
      capacity: 10
      refill-tokens: 10
      refill-period-seconds: 60
