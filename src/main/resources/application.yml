spring:
  application:
    name: open-pulse-checker
  datasource:
    url: jdbc:h2:mem:openpulse;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

openpulse:
  scheduler:
    poll-interval-ms: 5000
    worker-pool-size: 4
  alerting:
    webhook:
      enabled: false
      url: ""
  security:
    admin-username: admin
    admin-password: admin-change-me
    viewer-username: viewer
    viewer-password: viewer-change-me
