spring:
  datasource:
    url: ${OPENPULSE_DB_URL:jdbc:postgresql://postgres:5432/openpulse}
    username: ${OPENPULSE_DB_USERNAME:openpulse}
    password: ${OPENPULSE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    validate-on-migrate: true
    clean-disabled: true
    connect-retries: 5

openpulse:
  security:
    cors-allowed-origins: ${OPENPULSE_SECURITY_CORS_ALLOWED_ORIGINS:}
    cors-allow-credentials: ${OPENPULSE_SECURITY_CORS_ALLOW_CREDENTIALS:true}
    bootstrap-admin:
      enabled: ${OPENPULSE_SECURITY_BOOTSTRAP_ADMIN_ENABLED:false}
      emergency-fallback-enabled: ${OPENPULSE_SECURITY_BOOTSTRAP_ADMIN_EMERGENCY_FALLBACK_ENABLED:false}
      username: ${OPENPULSE_SECURITY_BOOTSTRAP_ADMIN_USERNAME:admin}
      password: ${OPENPULSE_SECURITY_BOOTSTRAP_ADMIN_PASSWORD:}
    setup:
      token-ttl-seconds: ${OPENPULSE_SECURITY_SETUP_TOKEN_TTL_SECONDS:900}
