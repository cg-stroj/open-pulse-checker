spring:
  datasource:
    url: ${OPENPULSE_DB_URL:jdbc:postgresql://localhost:5432/openpulse}
    username: ${OPENPULSE_DB_USERNAME:openpulse}
    password: ${OPENPULSE_DB_PASSWORD:openpulse}
    driver-class-name: org.postgresql.Driver
  test:
    database:
      replace: none
  flyway:
    enabled: true

openpulse:
  scheduler:
    poll-interval-ms: 600000
  security:
    bootstrap-admin:
      enabled: true
      emergency-fallback-enabled: true
      username: admin
      password: admin-change-me
  rate-limit:
    sensitive:
      capacity: 100000
      refill-tokens: 100000
      refill-period-seconds: 1
