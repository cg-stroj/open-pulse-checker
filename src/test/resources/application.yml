spring:
  test:
    database:
      replace: none
  datasource:
    url: jdbc:h2:mem:openpulse;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true

openpulse:
  scheduler:
    poll-interval-ms: 600000
  security:
    bootstrap-admin:
      enabled: true
      emergency-fallback-enabled: true
      username: admin
      password: admin-change-me
  rate-limit:
    sensitive:
      capacity: 100000
      refill-tokens: 100000
      refill-period-seconds: 1
